<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" width="1100" height="640" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <rect width="1100" height="640" fill="#fbfaf7"/>
  <text x="30" y="40" font-size="22" font-weight="bold" fill="#20211f">Token Budget Middleware — architecture, data flow, trust boundary</text>
  <text x="30" y="62" font-size="13" fill="#777870">TikTok TechJam 2026 · Track 1 · LyraYu · github.com/LyraYu/techjam-agent-launchpad</text>

  <!-- Experience layer -->
  <rect x="30" y="100" width="220" height="110" rx="10" fill="#fff" stroke="#deddd6"/>
  <text x="45" y="125" font-size="12" fill="#777870">EXPERIENCE LAYER</text>
  <text x="45" y="148" font-size="14" font-weight="bold" fill="#20211f">React Web UI</text>
  <text x="45" y="170" font-size="12" fill="#20211f">• tokenBudget field (create / edit)</text>
  <text x="45" y="188" font-size="12" fill="#20211f">• Budget panel: meter + ledger + Reset</text>

  <!-- Trust boundary -->
  <rect x="290" y="85" width="520" height="470" rx="14" fill="#efecff" stroke="#6954d9" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="305" y="108" font-size="12" font-weight="bold" fill="#513db9">TRUST BOUNDARY — control plane (server process). Decisions are made and enforced here, never in the UI.</text>

  <!-- Fastify -->
  <rect x="310" y="130" width="480" height="70" rx="10" fill="#fff" stroke="#deddd6"/>
  <text x="325" y="152" font-size="14" font-weight="bold" fill="#20211f">Fastify API  (apps/server/src/app.ts)</text>
  <text x="325" y="172" font-size="12" fill="#20211f">POST /agents/:id/messages   GET /agents/:id/policy-events   POST /agents/:id/budget/reset</text>
  <text x="325" y="190" font-size="12" fill="#20211f">zod validation: tokenBudget = positive int | null</text>

  <!-- AgentService -->
  <rect x="310" y="225" width="290" height="180" rx="10" fill="#fff" stroke="#deddd6"/>
  <text x="325" y="247" font-size="14" font-weight="bold" fill="#20211f">AgentService  (agent-service.ts)</text>
  <text x="325" y="270" font-size="12" fill="#20211f">sendMessage():</text>
  <text x="335" y="288" font-size="12" fill="#20211f">1  status checks (stopped / busy)</text>
  <text x="335" y="306" font-size="12" fill="#513db9" font-weight="bold">2  evaluateBudget(agent)  ← ENFORCEMENT POINT</text>
  <text x="335" y="324" font-size="12" fill="#20211f">3  write allowed|denied event</text>
  <text x="335" y="342" font-size="12" fill="#20211f">4  if allowed: create Run, set busy</text>
  <text x="335" y="360" font-size="12" fill="#20211f">   — all in ONE store transaction —</text>
  <text x="335" y="378" font-size="12" fill="#c55353">5  if denied: throw 429 AFTER commit</text>
  <text x="325" y="398" font-size="12" fill="#20211f">executeRun(): charge meter on completion</text>

  <!-- budget-policy -->
  <rect x="620" y="225" width="170" height="80" rx="10" fill="#fff" stroke="#6954d9"/>
  <text x="635" y="247" font-size="13" font-weight="bold" fill="#20211f">budget-policy.ts</text>
  <text x="635" y="266" font-size="11" fill="#20211f">pure, no I/O</text>
  <text x="635" y="282" font-size="11" fill="#20211f">evaluateBudget()</text>
  <text x="635" y="297" font-size="11" fill="#20211f">tokensFromUsage()</text>

  <!-- Store -->
  <rect x="620" y="325" width="170" height="80" rx="10" fill="#fff" stroke="#deddd6"/>
  <text x="635" y="347" font-size="13" font-weight="bold" fill="#20211f">JsonStore</text>
  <text x="635" y="366" font-size="11" fill="#20211f">launchpad.json</text>
  <text x="635" y="382" font-size="11" fill="#20211f">agents.tokenBudget / tokensUsed</text>
  <text x="635" y="397" font-size="11" fill="#513db9">policyEvents[]  (new)</text>

  <!-- Runner -->
  <rect x="310" y="430" width="480" height="105" rx="10" fill="#fff" stroke="#deddd6"/>
  <text x="325" y="452" font-size="14" font-weight="bold" fill="#20211f">AgentRunner  →  Codex CLI in disposable container   (UNCHANGED)</text>
  <text x="325" y="474" font-size="12" fill="#20211f">Invoked only when the decision is allow. Returns RunUsage on turn.completed.</text>
  <text x="325" y="492" font-size="12" fill="#20211f">Returns nothing on failure → meter unchanged, budget.unmetered event written.</text>
  <text x="325" y="518" font-size="12" fill="#777870">Limitation: no intra-Run signal, so a single admitted Run is not capped. Next step: metering proxy at the Ark boundary.</text>

  <!-- Model -->
  <rect x="850" y="430" width="220" height="105" rx="10" fill="#fff" stroke="#deddd6"/>
  <text x="865" y="452" font-size="12" fill="#777870">EXTERNAL</text>
  <text x="865" y="474" font-size="14" font-weight="bold" fill="#20211f">BytePlus ModelArk</text>
  <text x="865" y="494" font-size="12" fill="#20211f">Responses API</text>
  <text x="865" y="512" font-size="12" fill="#20211f">API key stays on the server</text>

  <!-- Arrows -->
  <line x1="250" y1="155" x2="308" y2="155" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="252" y="148" font-size="10" fill="#777870">HTTP</text>
  <line x1="550" y1="200" x2="550" y2="223" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="600" y1="265" x2="618" y2="265" stroke="#6954d9" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="600" y1="365" x2="618" y2="365" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="455" y1="405" x2="455" y2="428" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="462" y="420" font-size="10" fill="#33906d">allow only</text>
  <line x1="480" y1="428" x2="480" y2="405" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="486" y="420" font-size="10" fill="#777870">usage</text>
  <line x1="790" y1="482" x2="848" y2="482" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Ledger legend -->
  <rect x="30" y="240" width="220" height="200" rx="10" fill="#fff" stroke="#deddd6"/>
  <text x="45" y="262" font-size="12" fill="#777870">LEDGER EVENTS (policyEvents)</text>
  <text x="45" y="288" font-size="12" fill="#513db9">budget.allowed</text><text x="150" y="288" font-size="11" fill="#20211f">run admitted</text>
  <text x="45" y="310" font-size="12" fill="#c55353">budget.denied</text><text x="150" y="310" font-size="11" fill="#20211f">429, no Run</text>
  <text x="45" y="332" font-size="12" fill="#513db9">budget.charged</text><text x="150" y="332" font-size="11" fill="#20211f">meter += usage</text>
  <text x="45" y="354" font-size="12" fill="#777870">budget.unmetered</text><text x="150" y="354" font-size="11" fill="#20211f">failed, no usage</text>
  <text x="45" y="376" font-size="12" fill="#33906d">budget.reset</text><text x="150" y="376" font-size="11" fill="#20211f">operator recovery</text>
  <text x="45" y="405" font-size="11" fill="#20211f">Every event stores tokensUsed and</text>
  <text x="45" y="421" font-size="11" fill="#20211f">tokenBudget at decision time.</text>

  <!-- Footer -->
  <text x="30" y="590" font-size="12" fill="#20211f">Evidence: 22 automated tests (9 new) cover the pure policy, the service transaction, the HTTP boundary, legacy DB upgrade, and the failure path.  npm run check passes.</text>
  <text x="30" y="612" font-size="12" fill="#777870">Local Docker path is the judging path. No secrets in source, logs, traces, or UI.</text>
</svg>
